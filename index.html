<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>簡易記帳</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#1d2a27;--sub:#6b7b77;--line:#e3e8e6;--main:#2f7d6d;--exp:#d9534f;--inc:#2f7d6d;--bal:#3b6fd4}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2522;--text:#e8efed;--sub:#8fa19c;--line:#2a3532;--main:#4fb5a1;--exp:#ef7b77;--inc:#4fb5a1;--bal:#7aa5f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,"Microsoft JhengHei",sans-serif;padding-bottom:90px}
main{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
header h1{font-size:20px;margin:0}
.month{display:flex;align-items:center;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:var(--card);border:1px solid var(--line);border-radius:8px;width:34px;height:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum small{color:var(--sub);display:block}
.sum b{font-size:18px}
.exp{color:var(--exp)}.inc{color:var(--inc)}
.cat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.cat .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--main)}
.cat span:first-child{width:64px}.cat span:last-child{width:70px;text-align:right}
.day{color:var(--sub);font-size:13px;margin:16px 4px 4px;display:flex;justify-content:space-between}
.item{padding:12px 14px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0}
.item .top{display:flex;align-items:center;gap:12px}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.act button{border:0;background:none;color:var(--sub);font-size:13px;padding:4px 8px}
.act button.d{color:var(--exp)}
#pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:14px 0 0}
#pager button{min-width:36px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#pager button.on{background:var(--main);color:#fff;border-color:var(--main)}
#pager button:disabled{opacity:.4}
#pager small{flex-basis:100%;text-align:center;color:var(--sub)}
.item .m{flex:1;min-width:0}
.item .m small{color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:30px 0}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:32px;box-shadow:0 4px 14px #0004}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg[hidden]{display:none}
#typeBox[hidden]+#catBox{grid-column:1/-1}   /* 沒有類型選單時，分類佔滿整列 */
.seg button{flex:1;min-width:64px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.seg button.cu,.cats button.cu{border-color:var(--exp);color:var(--exp)}
.seg button.ro,.cats button.ro{opacity:.4}
.syncrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--sub)}
.syncrow label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:14px}
.syncrow input{width:18px;height:18px;padding:0}
/* 版面：手機單欄由上往下（#side 不產生外框，內容直接參與 main 的排列，用 order 把列表排在工具之前）；
   電腦（≥900px）兩欄：左欄 #side 捲動時固定在畫面上，內容太長時自己捲動，右欄是帳目列表 */
main{display:flex;flex-direction:column}
#side{display:contents}
main>header{order:0}
#side>.card{order:1}
#listwrap{order:2}
#side>.tools,#side>.syncrow{order:3}
main .card{margin:5px 0}   /* flex 內外距不會合併，所以手機版各減半以維持原本間距 */
@media (min-width:900px){
  main{max-width:1040px;display:grid;grid-template-columns:340px minmax(0,1fr);column-gap:20px;align-items:start}
  main>header{grid-column:1/-1}
  #side{display:block;grid-column:1;grid-row:2/span 30;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-right:2px}
  #listwrap{grid-column:2;grid-row:2/span 30}
  main .card{margin:10px 0}
  /* 左欄緊湊化：展開篩選時盡量不用捲動就能看到全部區塊 */
  #side>.card{padding:10px 12px;margin:8px 0}
  #side input,#side select{padding:6px 8px}
  #side .sum b{font-size:16px}
  #fpanel{gap:4px 8px;margin-top:6px}
  #fpanel label{font-size:12px;margin:0 0 1px}
  #fpanel .full.row{margin-top:2px!important}
  #fpanel .row button{padding:6px}
  #breakdown .cat{margin:3px 0}
  #side .tools{margin-top:10px;gap:6px}
  #side .tools button{padding:5px 8px;font-size:12px}
  #side .syncrow{margin-top:8px}
}
@media (min-width:900px) and (max-height:760px){
  #side>.card{margin:5px 0}
  #side .tools{margin-top:6px}
}
.mbtn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700}
.mbtn:disabled{opacity:.6}
.pkyear{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.pkyear input{width:96px;text-align:center;font-weight:700}
.pkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pkgrid button{padding:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);position:relative}
.pkgrid button.on{background:var(--main);color:#fff;border-color:var(--main)}
.pkgrid button.has::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--main)}
.pkgrid button.on.has::after{background:#fff}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mvarr{grid-column:1/-1;text-align:center;color:var(--sub);font-size:13px}
#mvGo{background:var(--main);color:#fff;border-color:var(--main)}
.addbox{display:flex;gap:6px;margin-top:8px}
.addbox[hidden]{display:none}
.addbox input{flex:1;min-width:0}
.addbox button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#tyAdd,#caAdd{background:var(--main);color:#fff;border-color:var(--main)}
/* 管理視窗：左邊類型清單、右邊該類型的分類清單；每列只放一個 ⋯，點開才出現編輯／刪除 */
#mgDlg{width:min(94vw,680px)}
.mghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mghead button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.mgcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:560px){.mgcols{grid-template-columns:1fr}}
.mgcols h4{margin:0 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.mglist{list-style:none;margin:0 0 6px;padding:0;max-height:min(46vh,340px);overflow-y:auto}
.mglist li{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 8px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.mglist li.sel{border-color:var(--main);outline:1px solid var(--main)}
.mglist li.grp{border:0;background:none;outline:0;cursor:default;padding:2px 2px 0;margin:8px 0 0;font-size:12px;color:var(--sub)}
.mglist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}
.mglist .nm.ci{color:var(--inc)}.mglist .nm.ce{color:var(--exp)}
.mglist .cnt{font-size:12px;color:var(--sub)}
.grip{cursor:grab;touch-action:none;user-select:none;color:var(--sub);padding:0 4px;font-style:normal;font-size:18px;line-height:1}
.mglist li[data-k]{user-select:none}
.mglist .more{border:0;background:none;color:var(--sub);font-size:18px;line-height:1;padding:0 4px}
.mglist .acts{flex-basis:100%;display:flex;gap:6px;padding-left:20px}
.mglist .acts button{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:13px}
.mglist .acts button[data-dt],.mglist .acts button[data-dc]{color:var(--exp)}
.mglist li.drag{opacity:.35}
.ghost{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1px solid var(--main);border-radius:8px;background:var(--card);box-shadow:0 4px 14px #0004;opacity:.95;white-space:nowrap;cursor:grabbing;list-style:none}
.ghost .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.ghost .nm.ci{color:var(--inc)}.ghost .nm.ce{color:var(--exp)}
.ghost .more,.ghost .acts,.ghost .cnt{display:none}
.mgtip{font-size:12px;color:var(--sub);margin:8px 0 0}
#mgSearch{margin-top:2px}
/* 金額等數字輸入框不要右側的 +/- 微調鈕，純輸入 */
#amt,#fMin,#fMax{-moz-appearance:textfield;appearance:textfield}
#amt::-webkit-outer-spin-button,#amt::-webkit-inner-spin-button,#fMin::-webkit-outer-spin-button,#fMin::-webkit-inner-spin-button,#fMax::-webkit-outer-spin-button,#fMax::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lnk{background:none;border:0;color:var(--sub);font-size:13px;padding:0 0 8px}
.seg button.on{background:var(--main);color:#fff;border-color:var(--main)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px}
.cats button.on{border-color:var(--main);outline:2px solid var(--main)}
.cats button.ci{color:var(--inc)}.cats button.ce{color:var(--exp)}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.row .pri{background:var(--main);color:#fff;border-color:var(--main)}
.row .del{color:var(--exp)}
.fbar{display:flex;gap:8px;align-items:center}
.fbar input{flex:1}
.fbar button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);white-space:nowrap}
.fbar button.on{background:var(--main);color:#fff;border-color:var(--main)}
#fpanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
#fpanel input,#fpanel select{min-width:0;max-width:100%}
#fpanel[hidden]{display:none}
#fpanel label{margin:0 0 2px}
#fpanel .full{grid-column:1/-1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tools button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px}
#rp{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);padding:12px 16px 40px}
#rp[hidden]{display:none}
.rpbar{display:flex;flex-wrap:wrap;gap:8px;max-width:760px;margin:0 auto 12px}
.rpbar button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rpbar .pri{background:var(--main);color:#fff;border-color:var(--main)}
.rpopts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:760px;margin:0 auto 12px}
.rpopts label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:14px}
.rpopts select{width:auto}
.rpopts [hidden]{display:none}
.rpopts input[type=checkbox]{width:18px;height:18px;padding:0}
#rpBody{max-width:760px;margin:0 auto}
#rpBody h2{margin:6px 0 12px}
#rpBody h3{margin:20px 0 6px;font-size:16px}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rsum div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--card)}
.rsum small{display:block;color:var(--sub)}
#rpBody table{width:100%;border-collapse:collapse;font-size:14px}
#rpBody th,#rpBody td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
#rpBody .n{text-align:right;white-space:nowrap}
.rb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.rb i{display:block;height:100%;background:var(--main)}
.rb,.rb i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pie{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0}
.pie svg{width:180px;height:180px;flex:none}
.pie ul,.lg{list-style:none;margin:0;padding:0;font-size:14px}
.pie ul{flex:1;min-width:160px}
.pie li,.lg li{display:flex;align-items:center;gap:6px;margin:3px 0}
.pie li span{margin-left:auto;padding-left:12px;color:var(--sub)}
.pie i,.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.line svg{width:100%;height:auto}
.lg{display:flex;gap:14px;margin-top:4px}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--sub:#555;--line:#ccc;--exp:#c0392b;--inc:#1e7a5f;--main:#2f7d6d;--bal:#3b6fd4}
  main,#fab,dialog,.noprint{display:none!important}
  body{padding:0;background:#fff}
  #rp{position:static;overflow:visible;padding:0}
  #rpBody tr{break-inside:avoid}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>💰 簡易記帳</h1>
    <div class="month">
      <button class="ic" id="prev">‹</button><button type="button" class="mbtn" id="mlabel" title="選擇年份與月份"></button><button class="ic" id="next">›</button>
    </div>
  </header>
  <aside id="side">
  <div class="card sum">
    <div><small>收入</small><b class="inc" id="sInc">0</b></div>
    <div><small>支出</small><b class="exp" id="sExp">0</b></div>
    <div><small>結餘</small><b id="sBal">0</b></div>
  </div>
  <div class="card">
    <div class="fbar">
      <input id="fq" type="search" placeholder="搜尋名稱、備註、分類">
      <button id="fToggle">🔍 篩選</button>
    </div>
    <div id="fpanel" hidden>
      <div><label>類型</label><select id="fType"><option value="">全部</option></select></div>
      <div><label>分類</label><select id="fCat"><option value="">全部</option></select></div>
      <div><label>起始日期</label><input id="fFrom" type="date"></div>
      <div><label>結束日期</label><input id="fTo" type="date"></div>
      <div><label>最低金額</label><input id="fMin" type="number" inputmode="decimal" min="0" step="any"></div>
      <div><label>最高金額</label><input id="fMax" type="number" inputmode="decimal" min="0" step="any"></div>
      <div class="full row" style="margin-top:4px"><button type="button" id="fClear">清除篩選</button></div>
    </div>
  </div>
  <div class="card" id="breakdown"></div>
  <div class="tools">
    <button id="exCsv">匯出 CSV</button>
    <button id="exJson">備份 JSON</button>
    <button id="imJson">還原 JSON</button>
    <input type="file" id="file" accept=".json" hidden>
    <button id="rpBtn">📄 月度統計</button>
    <button id="acBtn">∑ 累計統計</button>
    <button id="mgBtn">🏷 管理類型與分類</button>
    <button id="syncBtn">☁️ 雲端同步設定</button>
    <button id="clearBtn" style="color:var(--exp)">🗑 清除本地資料</button>
  </div>
  <div class="syncrow"><label><input type="checkbox" id="syncSw"> ☁️ 雲端同步</label><span id="syncStatus"></span></div>
  </aside>
  <div id="listwrap">
    <div id="list"></div>
    <div id="pager"></div>
  </div>
</main>
<button id="fab" aria-label="新增">+</button>

<div id="rp" hidden>
  <div class="rpbar noprint"><button class="pri" id="rpPrint">🖨 列印／存成 PDF</button><button id="rpSheet">📊 建立試算表月表</button><button id="rpClose">關閉</button></div>
  <div class="rpopts noprint">
    <label hidden>類型 <select id="acType"></select></label>
    <label>類型 <select id="rpType"></select></label>
    <label>分類 <select id="rpCat"></select></label>
    <label>起始 <select id="rpFrom"></select></label>
    <label>結束 <select id="rpTo"></select></label>
    <label><input type="checkbox" id="rpDetail" checked> 包含帳目明細</label>
  </div>
  <div id="rpBody"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <label>帳目名稱</label><input id="nm" type="text" maxlength="40" placeholder="例如：午餐便當">
    <label>金額</label><input id="amt" type="number" inputmode="decimal" min="0" step="any" required>
    <div class="two">
      <div id="typeBox"><label>類型</label><select id="typeSel"></select></div>
      <div id="catBox"><label>分類</label><select id="catSel"></select></div>
    </div>
    <div id="catNote" hidden style="font-size:12px;color:var(--sub);margin-top:4px">尚未建立分類，可到頁面下方「🏷 管理類型與分類」新增</div>
    <label>日期</label><input id="date" type="date" required>
    <label>備註</label><input id="note" type="text" maxlength="60">
    <div class="row">
      <button type="button" class="del" id="del" hidden>刪除</button>
      <button type="button" id="cancel">取消</button>
      <button type="submit" class="pri">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="pkDlg">
  <div class="pkyear">
    <button type="button" class="ic" id="pkPrev">‹</button>
    <input id="pkYearIn" type="number" inputmode="numeric" min="1970" max="2200" aria-label="年份">
    <button type="button" class="ic" id="pkNext">›</button>
  </div>
  <div class="pkgrid" id="pkGrid"></div>
  <div class="row"><button type="button" id="pkToday">回到本月</button><button type="button" id="pkClose">取消</button></div>
</dialog>

<dialog id="askDlg">
  <p id="askMsg" style="white-space:pre-line;margin:0 0 4px"></p>
  <div class="row"><button type="button" id="askNo">取消</button><button type="button" class="pri" id="askOk">確定</button></div>
</dialog>

<dialog id="mgDlg">
  <div class="mghead"><b>管理類型與分類</b><button type="button" id="mvOpen">批次搬移…</button></div>
  <input id="mgSearch" type="search" placeholder="搜尋類型或分類">
  <div class="mgcols">
    <section>
      <h4>類型</h4>
      <ul class="mglist" id="mgTypes"></ul>
      <div class="addbox">
        <input id="tyName" type="text" maxlength="20" placeholder="新類型，例如：生活">
        <button type="button" id="tyAdd">新增</button>
      </div>
    </section>
    <section>
      <h4 id="mgCatTitle">分類</h4>
      <ul class="mglist" id="mgCats"></ul>
      <div class="addbox">
        <input id="caName" type="text" maxlength="20" placeholder="新分類，例如：餐飲">
        <select id="caSign" style="width:auto"><option value="-1">支出</option><option value="1">收入</option></select>
        <button type="button" id="caAdd">新增</button>
      </div>
    </section>
  </div>
  <p class="mgtip">點左邊的類型，右邊會顯示它的分類；按住項目（或左邊的 ≡）拖曳排序，⋯ 開啟編輯／刪除。「未分組」＝沒放進類型的分類，不能改名或刪除。</p>
  <div class="row"><button type="button" class="pri" id="mgClose">完成</button></div>
</dialog>

<dialog id="mvDlg">
  <b>批次搬移帳目</b>
  <p class="mgtip">把某類型／分類的帳目整批改成另一個。</p>
  <div class="mv">
    <select id="mvFromType"></select><select id="mvFromCat"></select>
    <div class="mvarr">↓ 搬到</div>

<script>
const KEY="ledger.v1";
// 自訂類型／分類（沒有內建分類）：本機存一份，並同步到試算表的「設定」工作表（只同步名稱與收支方向，沒有圖示）
// 自訂類型 id = 正負號 + 名稱（如 "-儲蓄"），帳目本身也能辨識收支方向
let cfg=lget("ledger.cfg",{types:[],cats:{}});
// 設定與雲端「設定」工作表的轉換：每個類型／分類一列
// 順序（拖曳排序）：cfg.order = {types:[類型 id…], cats:{類型 id:[分類名稱…]}}，同步時各存成一列 kind="order"（name 欄放 JSON 清單）
// 累計統計：cfg.acc = [類型 id…]，有勾的類型會在試算表另外產生「累計・類型」工作表（統計該類型全部日期）；同步時存成一列 kind="acc"（name 欄放 JSON 清單）
const cfgKey=i=>i.k==="type"?"t|"+i.id:i.k==="order"?"o|"+(i.type||""):i.k==="acc"?"a|":"c|"+i.type+"|"+i.name;
const accOf=()=>cfg.acc||(cfg.acc=[]);
const accOp=()=>accOf().length?{op:"cset",item:{k:"acc",name:JSON.stringify(accOf())}}:{op:"cdel",item:{k:"acc"}};
const cfgItems=()=>{
  const o=cfg.order||{types:[],cats:{}};
  return [
    ...(accOf().length?[{k:"acc",name:JSON.stringify(accOf())}]:[]),
    ...cfg.types.map(t=>({k:"type",id:t.id,name:t.name})),
    ...Object.entries(cfg.cats).flatMap(([type,L])=>L.map(([,name])=>({k:"cat",type,name,sign:catSign(type,name)}))),
    ...(o.types&&o.types.length?[{k:"order",type:"",name:JSON.stringify(o.types)}]:[]),
    ...Object.entries(o.cats||{}).filter(([,L])=>L.length).map(([type,L])=>({k:"order",type,name:JSON.stringify(L)}))
  ];
};
function cfgFromItems(items){
  const c={types:[],cats:{},order:{types:[],cats:{}},acc:[]};
  items.forEach(i=>{
    if(i.k==="acc"){try{c.acc=(JSON.parse(i.name)||[]).map(String)}catch{}}
    else if(i.k==="type")c.types.push({id:i.id,name:i.name,sign:+i.sign||0});   // 類型沒有收支方向；舊版留下的 sign 只當新分類的預設
    else if(i.k==="order"){
      let L=[];try{L=JSON.parse(i.name)||[]}catch{}
      if(i.type)c.order.cats[i.type]=L;else c.order.types=L;
    }
    else(c.cats[i.type]=c.cats[i.type]||[]).push(["",i.name,+i.sign===1||+i.sign===-1?+i.sign:0]);   // [圖示(固定空), 名稱, 收支方向]
  });
  return c;
}
const ordOf=()=>{const o=cfg.order||(cfg.order={types:[],cats:{}});o.cats=o.cats||{};o.types=o.types||[];return o};
// 依儲存的順序排列；不在清單裡的排在後面，維持原本相對順序
function sortBy(list,order,key){
  if(!order||!order.length)return list;
  const p=x=>{const i=order.indexOf(key(x));return i<0?1e9:i};
  return list.map((x,n)=>[x,n]).sort((a,b)=>p(a[0])-p(b[0])||a[1]-b[1]).map(a=>a[0]);
}
// 類型只是分類的大群組，不帶收支方向；收入、支出只在統計時依分類方向分出來。
// 「未分組」是沒有放進任何自訂類型的分類與帳目所在的群組：不能改名、不能刪；
// 有自訂類型後，只有它底下有分類或帳目時才顯示。舊版內建的 exp／inc 兩個群組會自動併進來（migrateLegacy）。
const NOGROUP="未分組";
const legacyGroup=t=>t==="exp"||t==="inc";
function typeInfo(id){
  if(id===NOGROUP)return {id,name:NOGROUP};
  const f=cfg.types.find(t=>t.id===id);
  return f||{id,name:/^[+-]/.test(id)?id.slice(1):id};
}
// 收支方向綁在「分類」上，每筆帳目存自己的 sign（+1 收入／-1 支出），之後改分類的方向不會翻動舊帳目。
// 舊帳目沒有 sign 時由類型推出：inc 或 "+" 開頭是收入，其餘是支出（也是新分類的預設方向）。
const typeDefSign=id=>{const t=cfg.types.find(x=>x.id===id);return t&&(t.sign===1||t.sign===-1)?t.sign:(id==="inc"||id[0]==="+"?1:-1)};
const sgn=r=>r.sign===1||r.sign===-1?r.sign:typeDefSign(r.type);
const fixSigns=(arr,old)=>arr.map(r=>r.sign===1||r.sign===-1?r:{...r,sign:(old&&old.get(r.id))||typeDefSign(r.type)});
function allTypes(){
  const L=[...cfg.types];
  data.forEach(r=>{if(r.type!==NOGROUP&&!L.some(t=>t.id===r.type))L.push(typeInfo(r.type))});
  // 未分組：有分類或帳目時才列出；完全沒有自訂類型時一定列出（否則沒地方放分類）
  const used=(cfg.cats[NOGROUP]||[]).length||data.some(r=>r.type===NOGROUP);
  if(used||!L.length)L.unshift(typeInfo(NOGROUP));
  return sortBy(L,ordOf().types,t=>t.id);
}
const defType=()=>allTypes()[0].id;
// 舊版內建的 exp（支出）／inc（收入）群組併入「未分組」：帳目的類型改成「未分組」（收支方向先用舊規則存進 sign），
// 這兩個群組底下的自訂分類與順序也搬過去；兩邊有同名分類時，收入那邊加上「（收入）」以免混在一起。
// 回傳 {rows, ops}：ops 是要同步到試算表的變更（設定列與被改到的帳目），沒有舊資料時是空的。
function migrateLegacy(rows){
  const names={exp:new Set(),inc:new Set()};
  rows.forEach(r=>{if(legacyGroup(r.type))names[r.type].add(r.cat)});
  ["exp","inc"].forEach(g=>(cfg.cats[g]||[]).forEach(c=>names[g].add(c[1])));
  const nm=(g,n)=>g==="inc"&&names.exp.has(n)&&names.inc.has(n)?n+"（收入）":n;
  const ops=[];
  const out=rows.map(r=>{
    if(!legacyGroup(r.type))return r;
    const n={...r,type:NOGROUP,cat:nm(r.type,r.cat),sign:r.sign===1||r.sign===-1?r.sign:(r.type==="inc"?1:-1)};
    ops.push({op:"set",rec:n});
    return n;
  });
  const cfgOps=[];
  ["exp","inc"].forEach(g=>{
    const L=cfg.cats[g];if(!L)return;
    const dst=cfg.cats[NOGROUP]=cfg.cats[NOGROUP]||[];
    L.forEach(c=>{
      const name=nm(g,c[1]),sign=c[2]===1||c[2]===-1?c[2]:(g==="inc"?1:-1);
      cfgOps.push({op:"cdel",item:{k:"cat",type:g,name:c[1]}});
      if(!dst.some(x=>x[1]===name))dst.push(["",name,sign]);
      cfgOps.push({op:"cset",item:{k:"cat",type:NOGROUP,name,sign}});
    });
    delete cfg.cats[g];
  });
  const od=ordOf();
  ["exp","inc"].forEach(g=>{
    if(!od.cats[g])return;
    const merged=[...(od.cats[NOGROUP]||[]),...od.cats[g].map(n=>nm(g,n))];
    od.cats[NOGROUP]=[...new Set(merged)];delete od.cats[g];
    cfgOps.push({op:"cdel",item:{k:"order",type:g}},{op:"cset",item:{k:"order",type:NOGROUP,name:JSON.stringify(od.cats[NOGROUP])}});
  });
  if(od.types.some(legacyGroup)){
    od.types=[...new Set(od.types.map(x=>legacyGroup(x)?NOGROUP:x))];
    cfgOps.push({op:"cset",item:{k:"order",type:"",name:JSON.stringify(od.types)}});
  }
  if(cfgOps.length)lset("ledger.cfg",cfg);
  return {rows:out,ops:[...cfgOps,...ops]};
}
// 分類的收支方向：自訂分類設定 → 該分類帳目的方向 → 類型的預設方向
function catSign(t,name){
  const c=(cfg.cats[t]||[]).find(x=>x[1]===name);
  if(c&&(c[2]===1||c[2]===-1))return c[2];
  const r=data.find(x=>x.type===t&&x.cat===name);
  if(r)return sgn(r);
  return name==="其他收入"?1:typeDefSign(t);   // 「其他收入」是沒有任何分類時的預設選項
}
// 自訂分類 + 帳目裡出現過的分類（舊帳目用過的分類仍可辨識）；完全沒有時給「未分類」
// 項目格式 [圖示(固定空), 名稱, 收支方向]
function catsOf(t,noDefaults){
  const L=(cfg.cats[t]||[]).map(x=>["",x[1],catSign(t,x[1])]);
  data.forEach(r=>{if(r.type===t&&!L.some(x=>x[1]===r.cat))L.push(["",r.cat,sgn(r)])});
  if(noDefaults)return sortBy(L,ordOf().cats[t],x=>x[1]);   // 管理視窗只列真正存在的分類（設定裡的＋帳目用到的）
  // 「其他支出」「其他收入」是每個類型都固定有的基本選項（不是存起來的分類），排在自己的分類後面；
  // 已有同名的分類就用該分類
  [["","其他支出",-1],["","其他收入",1]].forEach(d=>{if(!L.some(x=>x[1]===d[1]))L.push(d)});
  return sortBy(L,ordOf().cats[t],x=>x[1]);
}
let data=fixSigns(load()), cur=new Date(); cur.setDate(1);
let edit=null, type=NOGROUP, cat="";
const $=id=>document.getElementById(id);

// 頁面內的確認／提示視窗：取代 confirm()/alert()，避免被瀏覽器或 PWA 擋掉而沒反應
function ask(msg,o={}){
  return new Promise(res=>{
    $("askMsg").textContent=msg;
    $("askOk").textContent=o.ok||"確定";$("askNo").textContent=o.no||"取消";$("askNo").hidden=!!o.single;
    const done=v=>{$("askOk").onclick=$("askNo").onclick=$("askDlg").oncancel=null;$("askDlg").close();res(v)};
    $("askOk").onclick=()=>done(true);
    $("askNo").onclick=()=>done(false);
    $("askDlg").oncancel=e=>{e.preventDefault();done(false)};   // 按 Esc 視為取消（用 cancel 事件，避免上一個視窗的 close 事件誤觸下一個）
    $("askDlg").showModal();
  });
}
const tell=msg=>ask(msg,{ok:"知道了",single:true});

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{tell("無法儲存（瀏覽器儲存空間被封鎖）")}}

// ---- Google 試算表同步：本機優先，變更先進佇列，再送出並拉回 ----
function lget(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let sync=lget("ledger.sync",null), queue=lget("ledger.queue",[]), busy=false;
function status(t){$("syncStatus").textContent=t}
const syncOn=()=>!!sync&&sync.on!==false;   // 已設定且開關為開
// 已設定但關閉時，變更仍先排進佇列，重新開啟後一併送出；不會發出任何連線
function enqueue(op){if(!sync)return;queue.push(op);lset("ledger.queue",queue);if(syncOn())flush()}
// 解析後端回應；不是 JSON 時（通常是 Apps Script 出錯的 Google 錯誤頁）把頁面文字帶進錯誤訊息，方便找原因
async function readJson(r,what="寫入"){
  const t=await r.text();
  try{return JSON.parse(t)}catch{
    const e=new Error(what+"時伺服器回傳的不是 JSON：「"+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160)+"」");
    e.notJson=true;throw e;
  }
}
// Google 偶爾在腳本還沒執行前就回暫時性的錯誤頁或斷線（Apps Script 執行紀錄看不到失敗），
// 所以自動重試最多 3 次。寫入指令都是冪等的（依 id／key 覆蓋或刪除），重送是安全的。
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(url,opt,what){
  for(let i=1;;i++){
    try{return await readJson(await fetch(url,opt),what)}
    catch(e){
      if(!(e.notJson||e instanceof TypeError)||i>=3)throw e;   // 只重試「回的不是 JSON」與連線錯誤；密碼錯誤等不重試
      await sleep(700*i);
    }
  }
}
async function flush(){
  if(!syncOn())return;
  if(busy){again=true;return}
  busy=true;again=false;status("☁️ 同步中…");
  try{
    // 變更分批送出（每批最多 40 個，送成功才從佇列移除）：一次送太多會超過 Apps Script 的執行時間上限而一直重試
    while(queue.length){
      const ops=queue.slice(0,40);
      status("☁️ 同步中…（剩 "+queue.length+" 項）");
      const j=await api(sync.url,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({token:sync.token,ops})},"寫入");
      if(!j.ok)throw new Error(j.error);
      queue=queue.slice(ops.length);lset("ledger.queue",queue);
    }
    const j=await api(sync.url+"?token="+encodeURIComponent(sync.token),undefined,"讀取");
    if(!j.ok)throw new Error(j.error);
    if(!queue.length){
      oldBackend=j.rows.length>0&&j.rows.some(r=>r.sign===undefined);   // 舊版後端不存收支方向
      data=fixSigns(j.rows,new Map(data.map(r=>[r.id,r.sign])));
      // 試算表裡有 id 重複的列（舊版同一毫秒建立多筆造成）：同步是依 id 覆蓋，重複的列永遠改不到，
      // 會讓同步一直重送。第一筆保留原 id，其餘換新 id，並在雲端刪掉多出的重複列、補寫新 id 的帳目
      const seen=new Set(),dupOps=[];
      let maxId=data.reduce((m,r)=>Math.max(m,r.id||0),0);
      data=data.map(r=>{
        if(!seen.has(r.id)){seen.add(r.id);return r}
        const n={...r,id:++maxId};
        dupOps.push({op:"del",id:r.id},{op:"set",rec:n});
        return n;
      });
      save();
      if(Array.isArray(j.cfg)){   // 舊版後端沒有 cfg 就略過
        if(!lget("ledger.cfgSynced",false)){
          // 第一次與這份試算表同步設定：把本機既有的自訂項目併入並上傳，避免被空的雲端設定蓋掉
          const have=new Set(j.cfg.map(cfgKey)),extra=cfgItems().filter(i=>!have.has(cfgKey(i)));
          j.cfg=[...j.cfg,...extra];
          extra.forEach(item=>queue.push({op:"cset",item}));lset("ledger.queue",queue);
          lset("ledger.cfgSynced",true);
        }
        cfg=cfgFromItems(j.cfg);lset("ledger.cfg",cfg);
      }
      // 雲端還留著舊版內建群組（exp／inc）時，併進「未分組」並把變更送回去（送完後雲端就沒有舊資料了）
      const m=migrateLegacy(data);
      // 保險：同一批舊資料轉換變更連續出現（代表雲端沒能存下）就不再重送，避免一直同步
      const sig=JSON.stringify(m.ops);
      migRepeat=m.ops.length&&sig===lastMig?migRepeat+1:0;lastMig=m.ops.length?sig:"";
      if(m.ops.length){data=m.rows;save()}
      if(m.ops.length&&migRepeat<2)queue.push(...m.ops);
      if(dupOps.length&&!dupSent){queue.push(...dupOps);dupSent=true}
      // 設定裡還沒有收支方向的舊分類：補上推導出來的方向（帳目的方向，否則類型預設），並寫回雲端（每次開啟只送一次）
      const fill=[];
      Object.entries(cfg.cats).forEach(([t,L])=>L.forEach(c=>{
        if(c[2]===1||c[2]===-1)return;
        c[2]=catSign(t,c[1]);
        fill.push({op:"cset",item:{k:"cat",type:t,name:c[1],sign:c[2]}});
      }));
      if(fill.length){lset("ledger.cfg",cfg);if(!signFilled){queue.push(...fill);signFilled=true}}
      // 舊設定清理（升級後第一次同步，每次開啟只送一次）：
      // ① 類型列殘留的收支方向（舊版方向綁類型時寫的，現在方向在分類與帳目上）清成空白；
      // ② 已經不存在的類型留下的分類與順序（沒有任何帳目使用）一併刪除。
      // 雲端是舊版後端（帳目沒有 sign）時不清，避免舊帳目失去推導依據。
      const clean=[];
      if(!oldBackend&&!cleanDone){
        cfg.types.forEach(t=>{
          if(t.sign===1||t.sign===-1){t.sign=0;clean.push({op:"cset",item:{k:"type",id:t.id,name:t.name}})}
        });
        Object.keys(cfg.cats).forEach(t=>{
          if(t===NOGROUP||cfg.types.some(x=>x.id===t)||data.some(r=>r.type===t))return;
          cfg.cats[t].forEach(c=>clean.push({op:"cdel",item:{k:"cat",type:t,name:c[1]}}));
          delete cfg.cats[t];
          if(ordOf().cats[t]){delete ordOf().cats[t];clean.push({op:"cdel",item:{k:"order",type:t}})}
        });
        if(clean.length){lset("ledger.cfg",cfg);queue.push(...clean)}
        cleanDone=true;
      }
      if(m.ops.length||dupOps.length||fill.length||clean.length)lset("ledger.queue",queue);
      render();
    }
    status("☁️ 已同步 "+new Date().toLocaleTimeString()+(oldBackend?"（⚠ 後端是舊版，收支方向存不進試算表，請更新 apps-script.gs 並部署新版本）":""));
  }catch(e){
    const why=e.message==="token"?"密碼錯誤"
      :e.notJson?e.message
      :/fetch|network/i.test(e.message)?"連不上：網路中斷，或存取權限不是「所有人」"
      :e.message;
    status("☁️ 同步失敗："+why+"（下次操作時會重試）");
  }
  busy=false;
  if(again||queue.length&&!/失敗/.test($("syncStatus").textContent))flush();
}
let again=false,oldBackend=false,migRepeat=0,lastMig="",dupSent=false,signFilled=false,cleanDone=false;
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=n=>Math.round(n*100)/100;
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 篩選下拉選單隨類型、分類變動而更新（保留目前選擇）
function fillFilters(){
  // 分類只列選到的類型底下的；沒選類型就列全部
  const types=allTypes(),tv=$("fType").value,cv=$("fCat").value;
  const cats=[...new Set((types.some(t=>t.id===tv)?[typeInfo(tv)]:types).flatMap(t=>catsOf(t.id).map(x=>x[1])))];
  const sig=JSON.stringify([types.map(t=>t.id),tv,cats]);
  if(sig===fillFilters.sig)return;
  fillFilters.sig=sig;
  $("fType").innerHTML='<option value="">全部</option>'+types.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");
  $("fCat").innerHTML='<option value="">全部</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  $("fType").value=tv;$("fCat").value=cats.includes(cv)?cv:"";   // 換類型後，原本選的分類不在新清單裡就清掉
}

function filt(){
  const q=$("fq").value.trim().toLowerCase(),t=$("fType").value,c=$("fCat").value,
        a=$("fFrom").value,b=$("fTo").value,lo=$("fMin").value,hi=$("fMax").value;
  return {active:!!(q||t||c||a||b||lo||hi),key:[q,t,c,a,b,lo,hi].join("|"),
    test:r=>(!q||((r.name||"")+" "+(r.note||"")+" "+r.cat).toLowerCase().includes(q))
      &&(!t||r.type===t)&&(!c||r.cat===c)&&(!a||r.date>=a)&&(!b||r.date<=b)&&(lo===""||r.amount>=+lo)&&(hi===""||r.amount<=+hi)};
}

const PER=10;           // 每頁筆數
let page=0,lastKey="";
function pagerHtml(pages){
  const btn=(p,t,cls="")=>`<button type="button" data-p="${p}" class="${cls}"${p<0||p>=pages?" disabled":""}>${t}</button>`;
  const nums=[];
  for(let i=0;i<pages;i++)if(i===0||i===pages-1||Math.abs(i-page)<=1)nums.push(i);
  let h=btn(page-1,"‹ 上一頁"),prev=-1;
  for(const i of nums){if(i-prev>1)h+="<span>…</span>";h+=btn(i,i+1,i===page?"on":"");prev=i}
  return h+btn(page+1,"下一頁 ›");
}

function render(){
  fillFilters();
  const ym=ymd(cur).slice(0,7),f=filt(),on=f.active;
  const key=on?f.key:ym;
  if(key!==lastKey){page=0;lastKey=key}   // 換月份或篩選條件時回到第一頁
  $("mlabel").textContent=on?"篩選結果":cur.getFullYear()+" 年 "+(cur.getMonth()+1)+" 月";
  $("prev").hidden=$("next").hidden=on;
  $("mlabel").disabled=on;   // 篩選中顯示「篩選結果」，不選月份
  $("fToggle").classList.toggle("on",on);
  const rows=data.filter(r=>on?f.test(r):r.date.startsWith(ym))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.time||"").localeCompare(a.time||"")||b.id-a.id);
  let inc=0,exp=0,by={};
  rows.forEach(r=>{
    if(sgn(r)>0)inc+=r.amount;
    else{exp+=r.amount;const b=by[r.cat]||(by[r.cat]={v:0,t:r.type});b.v+=r.amount}
  });
  $("sInc").textContent=fmt(inc);$("sExp").textContent=fmt(exp);$("sBal").textContent=fmt(inc-exp);
  const ents=Object.entries(by).sort((a,b)=>b[1].v-a[1].v);
  $("breakdown").hidden=!ents.length;
  $("breakdown").innerHTML=ents.map(([c,b])=>`<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${b.v/exp*100}%"></i></div><span>${fmt(b.v)}</span></div>`).join("");
  if(!rows.length){$("list").innerHTML='<div class="empty">'+(on?"沒有符合條件的紀錄":"本月尚無紀錄，按 + 新增")+'</div>';$("pager").innerHTML="";return}
  const pages=Math.ceil(rows.length/PER);
  if(page>=pages)page=pages-1;
  $("pager").innerHTML=pages>1?pagerHtml(pages)+`<small>第 ${page+1} / ${pages} 頁，共 ${rows.length} 筆</small>`:"";
  let html="";
  for(const r of rows.slice(page*PER,page*PER+PER)){
    // 日期直接放在每筆裡（篩選跨年時顯示完整年月日）
    const w="日一二三四五六"[new Date(r.date+"T00:00").getDay()];
    const when=(on?r.date:r.date.slice(5).replace("-","/"))+" 週"+w+(r.time?" "+r.time:"");
    html+=`<div class="item" data-id="${r.id}"><div class="top"><div class="m">${esc(r.name||r.cat)}<small>${when} · ${esc(r.cat)}${r.note?" · "+esc(r.note):""}</small></div><b class="${sgn(r)>0?"inc":"exp"}">${sgn(r)>0?"+":"-"}${fmt(r.amount)}</b></div><div class="act"><button type="button" data-edit="${r.id}">編輯</button><button type="button" class="d" data-del="${r.id}">刪除</button></div></div>`;
  }
  $("list").innerHTML=html;
}

let mv={ft:NOGROUP,fc:"",tt:NOGROUP,tc:""};
function drawMv(){
  const ts=allTypes();
  if(!ts.some(t=>t.id===mv.ft))mv.ft=ts[0].id;
  if(!ts.some(t=>t.id===mv.tt))mv.tt=ts[0].id;

  if(mv.tc&&!catsOf(mv.tt).some(c=>c[1]===mv.tc))mv.tc="";
  const opt=(arr,sel)=>arr.map(([v,t])=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(t)}</option>`).join("");
  const T=ts.map(t=>[t.id,t.name]);

  $("mvToType").innerHTML=opt(T,mv.tt);
  $("mvFromCat").innerHTML=opt([["","（全部分類）"],...catsOf(mv.ft).map(c=>[c[1],c[1]])],mv.fc);
  $("mvToCat").innerHTML=opt([["","（沿用原分類名稱）"],...catsOf(mv.tt).map(c=>[c[1],c[1]])],mv.tc);
  $("mvInfo").textContent="符合 "+data.filter(r=>r.type===mv.ft&&(!mv.fc||r.cat===mv.fc)).length+" 筆";

async function moveRecs(){
  const m=data.filter(r=>r.type===mv.ft&&(!mv.fc||r.cat===mv.fc));
  if(!m.length)return tell("沒有符合的帳目");
  if(mv.ft===mv.tt&&(!mv.tc||(mv.fc&&mv.tc===mv.fc)))return tell("來源與目的相同，不需要搬移");
  // 收支方向：指定了目的分類就跟著該分類；沿用原分類名稱時保留每筆原本的方向
  // 沿用原名稱時，如果目的類型已有同名分類，就跟著那個分類的方向（避免同一分類裡混著兩種方向）
  const hasCat=n=>(cfg.cats[mv.tt]||[]).some(x=>x[1]===n)||data.some(x=>x.type===mv.tt&&x.cat===n);
  const newSign=r=>mv.tc?catSign(mv.tt,mv.tc):hasCat(r.cat)?catSign(mv.tt,r.cat):sgn(r);
  const flip=m.filter(r=>newSign(r)!==sgn(r)).length;
  const warn=flip?"\n注意："+flip+" 筆的收支方向會改變（依目的分類"+(mv.tc?"「"+mv.tc+"」":"的同名分類")+"），統計會跟著改變。":"";
  const to=typeInfo(mv.tt).name+" / "+(mv.tc||"沿用原分類");
  if(!await ask("把 "+m.length+" 筆帳目搬到「"+to+"」？"+warn,{ok:"搬移"}))return;
  const ids=new Set(m.map(r=>r.id)),recs=[];
  data=data.map(r=>{
    if(!ids.has(r.id))return r;
    const n={...r,type:mv.tt,cat:mv.tc||r.cat,sign:newSign(r)};recs.push(n);return n;
  });
  // 目的類型補上被搬過去的分類（自訂分類，之後可管理、會同步），方向沿用搬過去的帳目
  const isDef=n=>n==="其他支出"||n==="其他收入";   // 預設選項不用存成分類設定
  const names=[...new Set(recs.map(r=>r.cat))].filter(n=>n!=="未分類"&&!isDef(n)&&!(cfg.cats[mv.tt]||[]).some(x=>x[1]===n));
  const ops=[];
  names.forEach(name=>{
    const sign=sgn(recs.find(r=>r.cat===name));
    (cfg.cats[mv.tt]=cfg.cats[mv.tt]||[]).push(["",name,sign]);
    ops.push({op:"cset",item:{k:"cat",type:mv.tt,name,sign}});
  });
  // 來源類型：帳目搬空的分類不自動刪除，改成存成分類設定留在原處（變成空分類），
  // 讓使用者自己確認後到管理視窗刪除；否則只靠帳目推出來的分類會在搬完後悄悄消失
  [...new Set(m.map(r=>r.cat))].forEach(n=>{
    if(isDef(n)||data.some(r=>r.type===mv.ft&&r.cat===n))return;   // 預設選項、或還有帳目在用，不用處理
    const L=cfg.cats[mv.ft]=cfg.cats[mv.ft]||[];
    if(L.some(x=>x[1]===n))return;
    const sign=sgn(m.find(r=>r.cat===n));
    L.push(["",n,sign]);
    ops.push({op:"cset",item:{k:"cat",type:mv.ft,name:n,sign}});
  });
  lset("ledger.cfg",cfg);
  save();
  pushOps([...ops,...recs.map(rec=>({op:"set",rec}))]);
  mv.fc="";drawMg();render();
  tell("已搬移 "+recs.length+" 筆帳目。");
}

// 把一批變更排進同步佇列（只 flush 一次）
function pushOps(ops){
  if(!sync||!ops.length)return;
  queue.push(...ops);lset("ledger.queue",queue);
  if(syncOn())flush();
}
// 頁面內的編輯視窗（取代 prompt）：名稱，sign 有給時多一個收支方向選單；回傳 {name,sign}，取消回傳 null
function askText(title,value,sign){
  return new Promise(res=>{
    $("renTitle").textContent=title;$("renIn").value=value;
    $("renSignBox").hidden=sign===undefined;
    if(sign!==undefined)$("renSign").value=String(sign);
    const done=v=>{$("renForm").onsubmit=$("renNo").onclick=$("renDlg").oncancel=null;$("renDlg").close();res(v)};
    $("renForm").onsubmit=e=>{e.preventDefault();done({name:$("renIn").value.trim(),sign:+$("renSign").value})};
    $("renNo").onclick=()=>done(null);
    $("renDlg").oncancel=e=>{e.preventDefault();done(null)};
    $("renDlg").showModal();$("renIn").focus();
  });
}
// 編輯分類（名稱、收支方向）：改名時該類型下所有相關帳目一併改名；改方向時詢問要不要一併改已有的帳目。
// 設定與每筆受影響的帳目都會同步
async function editCat(t,old){
  const oldSign=catSign(t,old);
  const r=await askText("編輯分類「"+old+"」",old,oldSign);
  if(r===null)return;
  const nn=r.name,ns=r.sign;
  if(!nn)return tell("名稱不能空白");
  if(nn===old&&ns===oldSign)return;
  if(nn!==old&&catsOf(t).some(x=>x[1]===nn))return tell("這個類型已有同名分類，要合併請用上方的「批次搬移」");
  const mine=data.filter(x=>x.type===t&&x.cat===old);
  // 改方向：已有帳目要不要一起改（不改的話只影響之後新增的帳目）
  let flipOld=false;
  if(ns!==oldSign&&mine.length)flipOld=await ask("「"+old+"」已有 "+mine.length+" 筆帳目。\n要把它們也改成"+(ns>0?"收入":"支出")+"嗎？\n（選「只改之後」則舊帳目維持原本方向）",{ok:"一併改",no:"只改之後"});
  const L=cfg.cats[t]=cfg.cats[t]||[],c=L.find(x=>x[1]===old);
  if(c){c[1]=nn;c[2]=ns}else L.push(["",nn,ns]);
  const recs=[];
  data=data.map(x=>{
    if(!(x.type===t&&x.cat===old))return x;
    const n={...x,cat:nn,sign:flipOld?ns:sgn(x)};
    if(n.cat!==x.cat||n.sign!==x.sign)recs.push(n);
    return n;
  });
  const ops=[];
  if(nn!==old)ops.push({op:"cdel",item:{k:"cat",type:t,name:old}});
  ops.push({op:"cset",item:{k:"cat",type:t,name:nn,sign:ns}});
  const od=ordOf().cats[t];
  if(nn!==old&&od){const i=od.indexOf(old);if(i>=0){od[i]=nn;ops.push({op:"cset",item:{k:"order",type:t,name:JSON.stringify(od)}})}}
  lset("ledger.cfg",cfg);save();
  pushOps([...ops,...recs.map(rec=>({op:"set",rec}))]);
  drawMg();render();
}
// 重新命名類型：類型 id 就是名稱，所以該類型的分類與所有帳目一併換成新名稱，並同步
async function renameType(id){
  const t=cfg.types.find(x=>x.id===id);if(!t)return;
  const rr=await askText("重新命名類型「"+t.name+"」",t.name);
  const nn=rr&&rr.name;
  if(rr===null||nn===t.name)return;
  if(!nn)return tell("名稱不能空白");
  if(allTypes().some(x=>x.id===nn||x.name===nn)||nn===NOGROUP||legacyGroup(nn))return tell("已有同名的類型");
  const oldCats=cfg.cats[id]||[],od=ordOf(),ops=[];
  oldCats.forEach(([,n])=>ops.push({op:"cdel",item:{k:"cat",type:id,name:n}}));
  ops.push({op:"cdel",item:{k:"type",id}});
  if(od.cats[id])ops.push({op:"cdel",item:{k:"order",type:id}});
  t.id=nn;t.name=nn;   // 舊版留下的 sign 欄保留，只當新分類的預設方向
  if(oldCats.length){cfg.cats[nn]=oldCats;delete cfg.cats[id]}
  od.types=od.types.map(x=>x===id?nn:x);
  if(od.cats[id]){od.cats[nn]=od.cats[id];delete od.cats[id]}
  const recs=[];
  data=data.map(r=>{if(r.type!==id)return r;const n={...r,type:nn};recs.push(n);return n});
  if(mgType===id)mgType=nn;
  if(mv.ft===id)mv.ft=nn;
  if(mv.tt===id)mv.tt=nn;
  ops.push({op:"cset",item:{k:"type",id:nn,name:nn}});
  (cfg.cats[nn]||[]).forEach(([,n])=>ops.push({op:"cset",item:{k:"cat",type:nn,name:n,sign:catSign(nn,n)}}));
  if(accOf().includes(id)){cfg.acc=accOf().map(x=>x===id?nn:x);ops.push(accOp())}
  if(od.types.length)ops.push({op:"cset",item:{k:"order",type:"",name:JSON.stringify(od.types)}});
  if(od.cats[nn])ops.push({op:"cset",item:{k:"order",type:nn,name:JSON.stringify(od.cats[nn])}});
  lset("ledger.cfg",cfg);save();
  pushOps([...ops,...recs.map(rec=>({op:"set",rec}))]);
  drawMg();render();
}
// 拖曳排序：按住清單項目左邊的把手 ⠿ 移動到想要的位置放開；滑鼠與觸控都可用。
// 分類只能在同一段（收入／支出）內交換。放開後呼叫 onDone(新順序的鍵清單)
function sortable(box,onDone){
  box.addEventListener("pointerdown",e=>{
    // 滑鼠：抓整列（按鈕除外）都能拖；觸控：只有把手能拖，不然手指滑動就無法捲動清單
    const grip=e.target.closest(".grip");
    if(!grip&&(e.pointerType==="touch"||e.target.closest("button")))return;
    const chip=e.target.closest("[data-k]");
    if(!chip||!box.contains(chip))return;
    e.preventDefault();   // 避免開始選取文字、觸控時捲動頁面
    const keys=()=>[...box.querySelectorAll("[data-k]")].map(x=>x.dataset.k);
    const before=keys().join("\u0001"),sx=e.clientX,sy=e.clientY;
    let moved=false,ghost=null;
    const rect=chip.getBoundingClientRect(),ox=sx-rect.left,oy=sy-rect.top;
    // move／up 掛在 document 上：重新排列時項目會被移動位置，掛在項目上的事件會因此中斷
    const move=ev=>{
      if(ev.pointerId!==e.pointerId)return;
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<4)return;
      if(!moved){
        moved=true;chip.classList.add("drag");
        // 跟著游標走的半透明複本；原位置的項目留作「放開後會在這裡」的預覽
        ghost=chip.cloneNode(true);
        ghost.className="ghost";ghost.style.cssText="position:fixed;z-index:99;pointer-events:none;margin:0;width:"+rect.width+"px";
        (box.closest("dialog")||document.body).appendChild(ghost);   // 放在視窗（dialog）裡才會顯示在它上面
      }
      ghost.style.left=(ev.clientX-ox)+"px";ghost.style.top=(ev.clientY-oy)+"px";
      // 游標一碰到同一段的別的項目就交換位置（不用拉過一半）
      const over=document.elementFromPoint(ev.clientX,ev.clientY);
      const t=over&&over.closest&&over.closest("[data-k]");
      if(t&&t!==chip&&box.contains(t)&&t.dataset.g===chip.dataset.g){
        const after=chip.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING;
        box.insertBefore(chip,after?t.nextSibling:t);
      }
    };
    const up=ev=>{
      if(ev.pointerId!==e.pointerId)return;
      document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      chip.classList.remove("drag");

    };

  });

// ---- 報表圖表：純 SVG（不依賴外部套件，離線與列印都能用）----
const PAL=["#2f7d6d","#e08a3c","#4a78c2","#c0504d","#8e6bbf","#d4b24c","#5aa9a0","#9a9a9a"];
// 圓餅圖：依金額由大到小，超過 7 項的合併成「其他」
function pieSvg(o,tot){
  let en=Object.entries(o).sort((x,y)=>y[1]-x[1]);
  if(!en.length||!(tot>0))return "";
  if(en.length>7)en=[...en.slice(0,7),["其他",en.slice(7).reduce((s,e)=>s+e[1],0)]];
  const R=90,C=100;let ang=-Math.PI/2,paths="";
  en.forEach(([,v],i)=>{
    const frac=v/tot,col=PAL[i%PAL.length];
    if(frac>=0.9999){paths+=`<circle cx="${C}" cy="${C}" r="${R}" fill="${col}"/>`;return}
    const a2=ang+frac*2*Math.PI;
    const x1=C+R*Math.cos(ang),y1=C+R*Math.sin(ang),x2=C+R*Math.cos(a2),y2=C+R*Math.sin(a2);
    paths+=`<path d="M${C} ${C}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 ${frac>0.5?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${col}" stroke="var(--card)" stroke-width="1"/>`;
    ang=a2;
  });
  const legend=en.map(([c,v],i)=>`<li><i style="background:${PAL[i%PAL.length]}"></i>${esc(c)}<span>${(v/tot*100).toFixed(1)}%</span></li>`).join("");
  return `<div class="pie"><svg viewBox="0 0 200 200" role="img" aria-label="圓餅圖">${paths}</svg><ul>${legend}</ul></div>`;
}
// 長條圖：每月的收入、支出、結餘（至少兩個月才畫）
function lineSvg(ms,pm){
  if(ms.length<2)return "";
  const W=600,H=240,L=56,RM=16,T=14,B=30,w=W-L-RM,h=H-T-B;
  const ser=[["收入","var(--inc)",m=>pm[m].inc],["支出","var(--exp)",m=>pm[m].exp],["結餘","var(--bal)",m=>pm[m].inc-pm[m].exp]];
  const vals=ser.flatMap(s=>ms.map(s[2]));
  const lo=Math.min(0,...vals);let hi=Math.max(0,...vals);if(hi===lo)hi=lo+1;
  const gw=w/ms.length,bw=Math.min(gw*0.8/3,28),X=i=>L+gw*(i+0.5),Y=v=>T+h*(1-(v-lo)/(hi-lo));
  let g="";
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4,y=Y(v).toFixed(1);
    g+=`<line x1="${L}" x2="${W-RM}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="currentColor">${Math.round(v).toLocaleString()}</text>`;
  }
  const step=Math.ceil(ms.length/10);
  ms.forEach((m,i)=>{if(i%step===0||i===ms.length-1)g+=`<text x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="11" fill="currentColor">${m.slice(2)}</text>`});
  const y0=Y(0);
  ser.forEach(([,col,f],si)=>{
    g+=ms.map((m,i)=>{
      const v=f(m),y=Y(v),x=X(i)+(si-1)*bw-bw/2;
      return `<rect x="${x.toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(Math.abs(y-y0),v?1:0).toFixed(1)}" fill="${col}"/>`;
    }).join("");
  });
  g+=`<line x1="${L}" x2="${W-RM}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="currentColor" stroke-opacity=".5"/>`;
  const legend=ser.map(([n,col])=>`<li><i style="background:${col}"></i>${n}</li>`).join("");
  return `<h3>每月趨勢</h3><div class="line"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每月收入、支出、結餘長條圖">${g}</svg><ul class="lg">${legend}</ul></div>`;
}
function renderReport(){
  // 累計模式：範圍是所選類型的全部帳目（不分月份）；月度模式：所選起訖月份
  const acc=rpMode==="acc",at=$("acType").value;
  let [a,b]=acc?["",""]:rpRange();
  if(acc){
    const mm=data.filter(r=>r.type===at).map(r=>ymOf(r.date)).sort();
    if(mm.length){a=mm[0];b=mm[mm.length-1]}
  }
  const ms=a?monthsBetween(a,b):[],multi=ms.length>1;
  const rt=acc?"":$("rpType").value,rc=$("rpCat").value;
  const rows=data.filter(r=>(acc?r.type===at:(m=>m>=a&&m<=b)(ymOf(r.date))&&(!rt||r.type===rt))&&(!rc||r.cat===rc))
    .sort((x,y)=>x.date.localeCompare(y.date)||(x.time||"").localeCompare(y.time||"")||x.id-y.id);
  let inc=0,exp=0;const ci={},ce={},pm={};
  ms.forEach(m=>{pm[m]={inc:0,exp:0,n:0}});
  rows.forEach(r=>{
    const p=sgn(r)>0,x=pm[ymOf(r.date)];
    x.n++;
    if(p){inc+=r.amount;x.inc+=r.amount;ci[r.cat]=(ci[r.cat]||0)+r.amount}
    else{exp+=r.amount;x.exp+=r.amount;ce[r.cat]=(ce[r.cat]||0)+r.amount}
  });
  const share=(o,tot)=>Object.entries(o).sort((x,y)=>y[1]-x[1]).map(([c,v])=>
    `<tr><td>${esc(c)}</td><td class="n">${fmt(v)}</td><td class="n">${(v/tot*100).toFixed(1)}%</td><td><div class="rb"><i style="width:${v/tot*100}%"></i></div></td></tr>`).join("")
    ||'<tr><td colspan="4">無</td></tr>';
  const perMonth=multi?`<h3>每月統計</h3><table><tr><th>月份</th><th class="n">收入</th><th class="n">支出</th><th class="n">結餘</th><th class="n">筆數</th></tr>`
    +ms.map(m=>{const x=pm[m];return `<tr><td>${m}</td><td class="n">${fmt(x.inc)}</td><td class="n">${fmt(x.exp)}</td><td class="n">${fmt(x.inc-x.exp)}</td><td class="n">${x.n}</td></tr>`}).join("")
    +`<tr><th>合計</th><th class="n">${fmt(inc)}</th><th class="n">${fmt(exp)}</th><th class="n">${fmt(inc-exp)}</th><th class="n">${rows.length}</th></tr></table>`+lineSvg(ms,pm):"";
  const detail=$("rpDetail").checked?`<h3>帳目明細</h3><table><tr><th>日期</th><th>時間</th><th>名稱</th><th>類型</th><th>分類</th><th class="n">金額</th><th>備註</th></tr>`
    +(rows.map(r=>{
      const p=sgn(r)>0;
      return `<tr><td>${multi?r.date:r.date.slice(5)}</td><td>${r.time||""}</td><td>${esc(r.name||"")}</td><td>${esc(typeInfo(r.type).name)}</td><td>${esc(r.cat)}</td><td class="n ${p?"inc":"exp"}">${p?"+":"-"}${fmt(r.amount)}</td><td>${esc(r.note||"")}</td></tr>`;
    }).join("")||'<tr><td colspan="7">這段期間沒有帳目</td></tr>')+"</table>":"";
  // 各類型自己的分類占比：期間內有兩個以上類型的帳目時，每個類型依收入／支出各列一張（只有一個類型就和上面兩大塊相同，不重複）
  const bt={};
  rows.forEach(r=>{
    const p=sgn(r)>0,k=r.type+"|"+(p?"+":"-");
    const t=bt[k]||(bt[k]={type:r.type,p,tot:0,cats:{}});
    t.tot+=r.amount;t.cats[r.cat]=(t.cats[r.cat]||0)+r.amount;
  });
  const manyTypes=!acc&&new Set(rows.map(r=>r.type)).size>=2;
  // 類型占比：各類型占總支出／總收入的比例（有兩個以上類型時才有意義）；選了特定分類時不顯示任何占比
  const te={},ti={};
  rows.forEach(r=>{const n=typeInfo(r.type).name,o=sgn(r)>0?ti:te;o[n]=(o[n]||0)+r.amount});
  const typeShare=(label,o,tot)=>`<h3>${label}</h3><table><tr><th>類型</th><th class="n">金額</th><th class="n">占比</th><th></th></tr>${share(o,tot)}</table>${pieSvg(o,tot)}`;
  const typeBlock=rc||!manyTypes?"":(Object.keys(te).length?typeShare("支出類型占比",te,exp):"")+(Object.keys(ti).length?typeShare("收入類型占比",ti,inc):"");
  const perType=rc||!manyTypes?"":Object.values(bt).sort((x,y)=>y.tot-x.tot)
    .map(o=>`<h3>${esc(typeInfo(o.type).name)}・${o.p?"收入":"支出"}占比（合計 ${fmt(o.tot)}）</h3><table><tr><th>分類</th><th class="n">金額</th><th class="n">占比</th><th></th></tr>${share(o.cats,o.tot)}</table>${pieSvg(o.cats,o.tot)}`).join("");
  const title=acc?"累計統計・"+esc(typeInfo(at).name)+(rc?"・"+esc(rc):"")+(a?"（"+a+" ～ "+b+"）":"（沒有帳目）")
    :(multi?a+" ～ "+b+" 月度統計":a.replace("-"," 年 ")+" 月 月度統計")
      +(rt||rc?"（"+[rt&&"類型："+esc(typeInfo(rt).name),rc&&"分類："+esc(rc)].filter(Boolean).join("、")+"）":"");
  $("rpBody").innerHTML=`<h2>${title}</h2>
    <div class="rsum"><div><small>收入</small><b class="inc">${fmt(inc)}</b></div><div><small>支出</small><b class="exp">${fmt(exp)}</b></div>
    <div><small>結餘</small><b>${fmt(inc-exp)}</b></div><div><small>筆數</small><b>${rows.length}</b></div></div>
    ${perMonth}
    ${typeBlock}
    ${rc?"":`<h3>支出占比</h3><table><tr><th>分類</th><th class="n">金額</th><th class="n">占比</th><th></th></tr>${share(ce,exp)}</table>${pieSvg(ce,exp)}
    <h3>收入占比</h3><table><tr><th>分類</th><th class="n">金額</th><th class="n">占比</th><th></th></tr>${share(ci,inc)}</table>${pieSvg(ci,inc)}`}
    ${perType}
    ${detail}`;
}
$("rpBtn").onclick=openReport;
$("acBtn").onclick=openAcc;
$("acType").onchange=()=>{fillRpFilters(true);renderReport()};
$("rpType").onchange=()=>{fillRpFilters(true);renderReport()};
$("rpCat").onchange=renderReport;
$("rpFrom").onchange=$("rpTo").onchange=()=>{
  const [a,b]=rpRange();
  if(!rpTouched)$("rpDetail").checked=(a===b);   // 跨多個月時預設不含明細（可自行勾選）
  renderReport();
};
$("rpDetail").onchange=()=>{rpTouched=true;renderReport()};
$("rpClose").onclick=()=>{$("rp").hidden=true};
$("rpPrint").onclick=()=>window.print();
// 在 Google 試算表建立（或重建）報表期間每個月的工作表（一次最多 12 個月）；
// 指令照一般變更排進佇列，會排在先前的帳目變更之後執行
$("rpSheet").onclick=async()=>{
  if(!sync)return tell("請先在「☁️ 雲端同步設定」填入網址與密碼");
  const [a,b]=rpRange(),ms=monthsBetween(a,b);
  if(ms.length>12)return tell("一次最多建立 12 個月的月表，請縮小期間");
  const note=syncOn()?"":"\n目前同步已關閉，開啟後才會執行。";
  const what=ms.length>1?ms.length+" 張月表（"+a+" ～ "+b+"）":"「"+a+"」工作表";
  if(!await ask("要在 Google 試算表建立（或重建）"+what+"嗎？\n內容含摘要、支出／收入占比、圓餅圖與當月明細。"+note,{ok:"建立"}))return;
  ms.forEach(ym=>enqueue({op:"month",ym}));
  if(syncOn())tell("指令已送出，約需數秒。狀態列顯示「已同步」後，試算表就會出現對應的工作表。");
};

$("clearBtn").onclick=async()=>{
  if(!await ask("清除這台裝置上的所有帳目？\n此動作無法復原，建議先備份 JSON。",{ok:"清除"}))return;
  // 已啟用同步時，本機只是雲端的快取，只清本機的話下次同步會被拉回來
  const cloud=syncOn()&&await ask("要連雲端試算表裡的帳目一起清除嗎？\n一併清除：所有裝置都會清空\n只清本機：下次同步會從雲端拉回",{ok:"一併清除",no:"只清本機"});
  const ids=data.map(r=>r.id);
  data=[];queue=cloud?ids.map(id=>({op:"del",id})):[];
  save();lset("ledger.queue",queue);render();
  if(cloud)flush();
};
$("syncBtn").onclick=()=>{$("syUrl").value=sync?sync.url:"";$("syTok").value=sync?sync.token:"";$("syncDlg").showModal()};
$("syCancel").onclick=()=>$("syncDlg").close();
$("syncForm").onsubmit=()=>{
  const url=$("syUrl").value.trim(),token=$("syTok").value;
  if(!url){sync=null;queue=[];try{localStorage.removeItem("ledger.sync");localStorage.removeItem("ledger.queue")}catch{}status("");$("syncSw").checked=false;return}
  sync={url,token,on:true};lset("ledger.sync",sync);$("syncSw").checked=true;
  lset("ledger.cfgSynced",false);   // 換了試算表：下次拉取時重新合併類型／分類設定
  queue=data.map(rec=>({op:"set",rec}));lset("ledger.queue",queue);  // 首次：本機資料全部上傳（以 id 合併）
  flush();
};

// 同步開關：開＝立刻同步；關＝完全不連線（變更先存本機，重新開啟後補送）；尚未設定時開啟設定視窗
$("syncSw").checked=syncOn();
$("syncSw").onchange=()=>{
  if(!sync){$("syncSw").checked=false;$("syncBtn").click();return}
  sync.on=$("syncSw").checked;lset("ledger.sync",sync);
  if(sync.on)flush();else status("☁️ 同步已關閉（變更先存在本機，開啟後補送）");
};

// 啟動時：本機還留著舊版內建群組（exp／inc）就併進「未分組」；有設定同步時把變更排進佇列
{
  const m=migrateLegacy(data);
  if(m.ops.length){
    data=m.rows;save();
    if(sync){queue.push(...m.ops);lset("ledger.queue",queue)}
  }
}
render();
if(syncOn())flush();
else if(sync)status("☁️ 同步已關閉（變更先存在本機，開啟後補送）");
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
